[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pragmas-cli"
version = "0.1.0"
description = "PRAGMAS from your terminal — deterministic analysis templates, public market search, and (soon) the agent, scriptable."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "PRAGMAS" }]
keywords = ["pragmas", "cli", "financial-analysis", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pragmas-sdk>=0.1.0",
    "typer>=0.12",
    "rich>=13.0",
    # Already an implicit dependency (main.py's `doctor --check-api` has
    # imported it directly since before this file existed, working only
    # because pragmas-sdk pulls it in transitively) — declared explicitly
    # now that local_agent.py depends on it directly too, for the same
    # reason pragmas-sdk pins its own version.
    "httpx>=0.27",
    # Floor pinned to the version this was actually built and tested
    # against (confirmed compatible with this project's own
    # requires-python floor: Textual 8.2.8 itself declares >=3.9,<4.0).
    "textual>=8.2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    # Needed for tests/test_tui_app.py — Textual's own App.run_test() is an
    # async context manager (Pilot), driving the app headlessly with no
    # real terminal required.
    "pytest-asyncio>=0.24",
]

[project.scripts]
pragmas = "pragmas_cli.main:main"

[project.urls]
Homepage = "https://pragmas.io"
Repository = "https://github.com/pragmasg/pragmas-cli"
Issues = "https://github.com/pragmasg/pragmas-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pragmas_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
